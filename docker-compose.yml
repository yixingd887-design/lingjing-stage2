services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api:app --app-dir /app/web_app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./web_app/uploads:/app/web_app/uploads
      - ./web_app/results:/app/web_app/results

  
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run /app/web_app/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

